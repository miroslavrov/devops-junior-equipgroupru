global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: equip-todo
    env: local

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: docker-host

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: nginx-log
    static_configs:
      - targets: ["nginxlog-exporter:4040"]

  - job_name: php-fpm
    static_configs:
      - targets: ["php-fpm-exporter:9253"]

  - job_name: mysql-master
    static_configs:
      - targets: ["mysqld-exporter-master:9104"]
        labels:
          role: master
          instance_name: db-master

  - job_name: mysql-slave
    static_configs:
      - targets: ["mysqld-exporter-slave:9104"]
        labels:
          role: slave
          instance_name: db-slave
