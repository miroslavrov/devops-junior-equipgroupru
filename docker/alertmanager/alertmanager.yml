global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      continue: true

receivers:
  - name: default
    webhook_configs:
      - url: "http://127.0.0.1:1/noop"
        send_resolved: false

  - name: critical
    webhook_configs:
      - url: "http://127.0.0.1:1/critical"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "instance"]
