listen:
  port: 4040
  address: "0.0.0.0"

consul:
  enable: false

namespaces:
  - name: nginx
    source:
      files:
        - /var/log/nginx/access_main.log
    format: "$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\" ups=\"$upstream_addr\" upt=$upstream_response_time"
    labels:
      app: equip-todo
    relabel_configs:
      - target_label: status_class
        from: status
        split: 1
        matches:
          - regexp: "^2"
            replacement: "2xx"
          - regexp: "^3"
            replacement: "3xx"
          - regexp: "^4"
            replacement: "4xx"
          - regexp: "^5"
            replacement: "5xx"
    histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]
