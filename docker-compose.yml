name: equip-todo

x-app-env: &app-env
  APP_NAME: "${APP_NAME:-EquipTodo}"
  APP_ENV: "${APP_ENV:-production}"
  APP_DEBUG: "${APP_DEBUG:-false}"
  APP_URL: "${APP_URL:-http://localhost}"
  APP_KEY: "${APP_KEY:-}"
  LOG_CHANNEL: "${LOG_CHANNEL:-stderr}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  WRITER_DB_CONNECTION: mysql
  WRITER_DB_HOST: db-master
  WRITER_DB_PORT: "3306"
  WRITER_DB_DATABASE: "${MYSQL_DATABASE:-app}"
  WRITER_DB_USERNAME: "${MYSQL_USER:-app}"
  WRITER_DB_PASSWORD: "${MYSQL_PASSWORD:-app}"
  READER_DB_CONNECTION: mysql
  READER_DB_HOST: db-slave
  READER_DB_PORT: "3306"
  READER_DB_DATABASE: "${MYSQL_DATABASE:-app}"
  READER_DB_USERNAME: "${MYSQL_USER:-app}"
  READER_DB_PASSWORD: "${MYSQL_PASSWORD:-app}"
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile

x-restart: &restart
  restart: unless-stopped

services:
  db-master:
    image: mariadb:10.11
    <<: *restart
    hostname: db-master
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-app}"
      MYSQL_USER: "${MYSQL_USER:-app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-app}"
    volumes:
      - mariadb_master_data:/var/lib/mysql
      - ./docker/mariadb/master/my.cnf:/etc/mysql/conf.d/master.cnf:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend
    ports:
      - "${MYSQL_MASTER_PORT:-3307}:3306"

  db-slave:
    image: mariadb:10.11
    <<: *restart
    hostname: db-slave
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-app}"
      MYSQL_USER: "${MYSQL_USER:-app}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-app}"
    volumes:
      - mariadb_slave_data:/var/lib/mysql
      - ./docker/mariadb/slave/my.cnf:/etc/mysql/conf.d/slave.cnf:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend
    ports:
      - "${MYSQL_SLAVE_PORT:-3308}:3306"

  replication-init:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_REPL_USER: "${MYSQL_REPL_USER:-repl}"
      MYSQL_REPL_PASSWORD: "${MYSQL_REPL_PASSWORD:-repl}"
      MASTER_HOST: db-master
      SLAVE_HOST: db-slave
    entrypoint: ["/bin/sh", "/opt/setup-replication.sh"]
    volumes:
      - ./docker/mariadb/init/setup-replication.sh:/opt/setup-replication.sh:ro
    depends_on:
      db-master:
        condition: service_healthy
      db-slave:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  app1:
    build: *app-build
    image: equip-todo-app:latest
    <<: *restart
    hostname: app1
    environment:
      <<: *app-env
      APP_ROLE: app
    volumes:
      - app_public:/var/www/html/public
      - app_storage_app1:/var/www/html/storage
    depends_on:
      replication-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || (cgi-fcgi -bind -connect 127.0.0.1:9000 || true) >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  app2:
    build: *app-build
    image: equip-todo-app:latest
    <<: *restart
    hostname: app2
    environment:
      <<: *app-env
      APP_ROLE: app
    volumes:
      - app_public:/var/www/html/public:ro
      - app_storage_app2:/var/www/html/storage
    depends_on:
      replication-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      app1:
        condition: service_started
    networks:
      - backend

  migrate:
    build: *app-build
    image: equip-todo-app:latest
    environment:
      <<: *app-env
      APP_ROLE: migrate
    depends_on:
      replication-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    <<: *restart
    hostname: nginx
    ports:
      - "${APP_PORT:-8080}:80"
      - "${NGINX_STATUS_PORT:-8081}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
    networks:
      - backend
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: *restart
    hostname: node-exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *restart
    hostname: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    <<: *restart
    hostname: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://nginx:8080/nginx_status"
    depends_on:
      - nginx
    networks:
      - monitoring

  nginxlog-exporter:
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    <<: *restart
    hostname: nginxlog-exporter
    command: ["-config-file", "/etc/prometheus-nginxlog-exporter.yml"]
    volumes:
      - ./docker/nginxlog-exporter/config.yml:/etc/prometheus-nginxlog-exporter.yml:ro
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      - nginx
    networks:
      - monitoring

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    <<: *restart
    hostname: php-fpm-exporter
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://app1:9000/fpm-status,tcp://app2:9000/fpm-status"
      PHP_FPM_LOG_LEVEL: info
    depends_on:
      - app1
      - app2
    networks:
      - backend
      - monitoring

  mysqld-exporter-master:
    image: prom/mysqld-exporter:v0.15.1
    <<: *restart
    hostname: mysqld-exporter-master
    command:
      - "--mysqld.address=db-master:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER:-exporter}"
      - "--collect.global_status"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.slave_status"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD:-exporter}"
    depends_on:
      replication-init:
        condition: service_completed_successfully
    networks:
      - backend
      - monitoring

  mysqld-exporter-slave:
    image: prom/mysqld-exporter:v0.15.1
    <<: *restart
    hostname: mysqld-exporter-slave
    command:
      - "--mysqld.address=db-slave:3306"
      - "--mysqld.username=${MYSQL_EXPORTER_USER:-exporter}"
      - "--collect.global_status"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.slave_status"
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD:-exporter}"
    depends_on:
      replication-init:
        condition: service_completed_successfully
    networks:
      - backend
      - monitoring

  exporter-init:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_EXPORTER_USER: "${MYSQL_EXPORTER_USER:-exporter}"
      MYSQL_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD:-exporter}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        for host in db-master db-slave; do
          mariadb -h "$$host" -uroot -p"$$MYSQL_ROOT_PASSWORD" <<SQL
        CREATE USER IF NOT EXISTS '$$MYSQL_EXPORTER_USER'@'%' IDENTIFIED BY '$$MYSQL_EXPORTER_PASSWORD' WITH MAX_USER_CONNECTIONS 3;
        GRANT PROCESS, REPLICATION CLIENT, BINLOG MONITOR, SLAVE MONITOR, SELECT ON *.* TO '$$MYSQL_EXPORTER_USER'@'%';
        FLUSH PRIVILEGES;
        SQL
        done
    depends_on:
      replication-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *restart
    hostname: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *restart
    hostname: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    <<: *restart
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring

volumes:
  mariadb_master_data:
  mariadb_slave_data:
  app_public:
  app_storage_app1:
  app_storage_app2:
  nginx_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge
